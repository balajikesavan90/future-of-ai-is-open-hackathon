[tool.poetry]
name = "arctic-analytics"
version = "0.1.0"
description = "An open-source framework exploring metadata-aware, transparent, and constrained AI-assisted analysis over structured data."
authors = ["BalajiKesavan <36139209+balajikesavan90@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/balajikesavan90/future-of-ai-is-open-hackathon"
packages = [{include = "arctic_analytics", from = "src"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]


[tool.poetry.dependencies]
python = "^3.12"
streamlit = {extras = ["charts"], version = "^1.50.0"}
snowflake-connector-python = "^3.17.0"
seaborn = "^0.13.2"
plotly = "^6.0.1"
replicate = "^1.0.4"
openai = "^1.70.0"
tiktoken = "^0.9.0"
pyarrow = "^18.0.0"
pillow = "^11.3.0"
pydantic = "^2.11.3"
statsmodels = "^0.14.4"
matplotlib = "^3.10.7"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"


[tool.poetry.scripts]
arctic-analytics-app = "arctic_analytics.cli:main"


[tool.pytest.ini_options]
pythonpath = [".", "src"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
