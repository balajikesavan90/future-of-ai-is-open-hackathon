[tool.poetry]
name = "python-data-analysis-agent"
version = "2.0.0"
description = "An experimental open-source framework for metadata-aware, inspectable, constrained AI-assisted analysis over structured data."
authors = ["BalajiKesavan <36139209+balajikesavan90@users.noreply.github.com>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/balajikesavan90/python-data-analysis-agent"
packages = [{include = "python_data_analysis_agent", from = "src"}]
include = [{path = "src/python_data_analysis_agent/CITATION.cff", format = ["sdist", "wheel"]}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]


[tool.poetry.dependencies]
python = "^3.12"
streamlit = {extras = ["charts"], version = "^1.50.0"}
seaborn = "^0.13.2"
plotly = "^6.0.1"
openai = "^1.70.0"
tiktoken = "^0.9.0"
pyarrow = ">=18,<24"
pillow = ">=11.3,<13.0"
statsmodels = "^0.14.4"
matplotlib = "^3.10.7"
jsonschema = "^4.25.1"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"


[tool.poetry.scripts]
python-data-analysis-agent-app = "python_data_analysis_agent.cli:main"
python-data-analysis-agent = "python_data_analysis_agent.cli:main"


[tool.pytest.ini_options]
pythonpath = [".", "src"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
