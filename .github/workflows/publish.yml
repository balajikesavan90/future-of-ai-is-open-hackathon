name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (for example, v2.0.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null || {
            echo "Release tag does not exist: $RELEASE_TAG"
            exit 1
          }

          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "Release tag must begin with 'v', got: $RELEASE_TAG"
              exit 1
              ;;
          esac

          expected_version="${RELEASE_TAG#v}"
          poetry_version="$(poetry version --short)"
          runtime_version="$(PYTHONPATH=src python -c 'from python_data_analysis_agent import __version__; print(__version__)')"
          if [ "$poetry_version" != "$expected_version" ] || [ "$runtime_version" != "$expected_version" ]; then
            echo "Release tag $RELEASE_TAG must match Poetry version ($poetry_version) and runtime version ($runtime_version)"
            exit 1
          fi

          python scripts/validate_release_metadata.py "$expected_version"

      - name: Validate package metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
