name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish (for example, v2.0.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *)
              echo "Release tag must begin with 'v', got: $RELEASE_TAG"
              exit 1
              ;;
          esac

          expected_version="${RELEASE_TAG#v}"
          actual_version="$(poetry version --short)"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $actual_version"
            exit 1
          fi

      - name: Validate package metadata
        run: poetry check

      - name: Build distributions
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
